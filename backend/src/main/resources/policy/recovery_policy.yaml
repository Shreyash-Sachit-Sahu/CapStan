# The policy table. Deliberately a document rather than code: a judge can read
# this and verify it, which they cannot do with a prompt.
#
# Not listed here: UNDIAGNOSED. It has no ladder because it is not a diagnosis --
# it is the absence of one, and it is handled by the affirmative-clearance branch
# in PolicyEngine (see phase-04 §3). A case where we do not know the cause must
# earn a debit by clearing checks against our own records, not inherit one from a
# table row.
#
# max_debit_attempts defaults to 0 when omitted, so a ladder that never mentions
# it can never authorise a debit by accident.
# max_nudges defaults to unset, meaning guardrail G8's cycle-wide comms cap governs.

version: 1

policies:
  - cause: NETWORK_TIMEOUT
    ladder: [RECONCILE_ONLY, IMMEDIATE_RETRY, SCHEDULED_RETRY]
    schedule: { SCHEDULED_RETRY: "+6h" }
    max_debit_attempts: 2
    # This ladder has no explicit terminal rung, unlike the others. Exhausting it
    # abandons the case, so the reason has to be stated here or the terminal
    # record would carry a generated placeholder.
    terminal_reason: "Gateway never returned a terminal response within the cycle"
    note: "Reconcile first, always. The debit may already have succeeded."

  - cause: INSUFFICIENT_FUNDS
    ladder: [PAYDAY_RETRY, CUSTOMER_NUDGE, PAYDAY_RETRY, SCHEDULED_RETRY, ABANDON]
    schedule: { PAYDAY_RETRY: "next_payday_window", SCHEDULED_RETRY: "+48h" }
    max_debit_attempts: 3
    max_nudges: 1
    terminal_reason: "Balance never arrived within the billing cycle"
    note: "Retrying before the balance arrives burns an attempt for nothing."
    # Defect fix. This ladder offered two debit rungs while declaring a cap of
    # three, and the ladder is what binds -- so the stated policy was never the
    # policy that ran. INSUFFICIENT_FUNDS is 32% of the batch, and it was the only
    # cause in the table whose debit-rung count disagreed with its own cap.
    #
    # The third rung is SCHEDULED_RETRY rather than a third PAYDAY_RETRY because a
    # payday rung could not fire: next_payday_window advances a whole month per
    # step, and a 35-day cycle contains at most two occurrences of a given salary
    # date. A third payday rung would have restored the declared count while never
    # executing, which is a worse defect than the one being fixed.
    #
    # +48h is a judgement, stated as one: a salary credit that misses its expected
    # date usually lands within two days, which is consistent with this cause's
    # note above. It was chosen once and not tuned -- no alternative delays were
    # tried and compared.

  - cause: ISSUER_DECLINE_TEMPORARY
    ladder: [SCHEDULED_RETRY, SCHEDULED_RETRY, RAIL_SWITCH, ABANDON]
    schedule: { SCHEDULED_RETRY: "exp_backoff(4h, 2.0, jitter=0.2)" }
    max_debit_attempts: 3
    terminal_reason: "Issuer kept declining across the permitted attempts"

  - cause: DO_NOT_HONOUR
    ladder: [SCHEDULED_RETRY, CUSTOMER_NUDGE, SCHEDULED_RETRY, ABANDON]
    schedule: { SCHEDULED_RETRY: "+24h" }
    max_debit_attempts: 2
    terminal_reason: "Undisclosed issuer decline persisted after two probes"
    note: "Ambiguous. Two probes maximum, then ask the customer."

  - cause: CARD_EXPIRED
    ladder: [REAUTH_LINK, CUSTOMER_NUDGE, HUMAN_ESCALATION]
    max_debit_attempts: 0
    note: "No debit can succeed. Retrying is pure waste."

  - cause: MANDATE_LIMIT_EXCEEDED
    ladder: [REAUTH_LINK, CUSTOMER_NUDGE, HUMAN_ESCALATION]
    max_debit_attempts: 0

  # Added when the taxonomy gained MANDATE_EXPIRED. Same shape as the other
  # re-auth causes: no debit on the existing instrument can ever succeed.
  - cause: MANDATE_EXPIRED
    ladder: [REAUTH_LINK, CUSTOMER_NUDGE, HUMAN_ESCALATION]
    max_debit_attempts: 0

  - cause: AUTHENTICATION_FAILED
    ladder: [RAIL_SWITCH, REAUTH_LINK, ABANDON]
    max_debit_attempts: 1
    terminal_reason: "Authentication could not be completed on any available rail"

  - cause: MANDATE_REVOKED
    ladder: [ABANDON]
    max_debit_attempts: 0
    terminal_reason: "Customer withdrew authorisation"

  - cause: ACCOUNT_CLOSED
    ladder: [ABANDON]
    max_debit_attempts: 0
    terminal_reason: "Underlying account closed"

  - cause: RISK_BLOCKED
    ladder: [HUMAN_ESCALATION]
    max_debit_attempts: 0
    note: "Hard stop. Automation must never retry a risk-blocked debit."

  - cause: TECHNICAL_DECLINE_UNKNOWN
    ladder: [SCHEDULED_RETRY, HUMAN_ESCALATION]
    schedule: { SCHEDULED_RETRY: "+12h" }
    max_debit_attempts: 1
    note: "Low confidence. One conservative probe, then a human."

# Used when diagnosis_confidence < 0.60 or the method was ABSTAIN. An uncertain
# label must never authorise an aggressive ladder.
low_confidence:
  ladder: [SCHEDULED_RETRY, HUMAN_ESCALATION]
  schedule: { SCHEDULED_RETRY: "+12h" }
  max_debit_attempts: 1

# Used when the cause is UNDIAGNOSED and every clearance check passed.
undiagnosed_cleared:
  ladder: [SCHEDULED_RETRY, HUMAN_ESCALATION]
  schedule: { SCHEDULED_RETRY: "+12h" }
  max_debit_attempts: 1

# Used when the cause is UNDIAGNOSED and any clearance check failed OR was
# unavailable. Absence of a clearance is not a clearance.
undiagnosed_uncleared:
  ladder: [HUMAN_ESCALATION]
  max_debit_attempts: 0
